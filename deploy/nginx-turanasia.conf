# /etc/nginx/sites-available/turanasia
# Фронт (статика) + Laravel API на одном домене.
# Веб-корень = public/ Laravel; статические страницы фронта лежат рядом с index.php.
#
# ВНИМАНИЕ. Здесь только блок на 80 порту. Блок HTTPS (443) на сервере
# дописан certbot'ом и в репозиторий не попадает. Если скопировать этот файл
# поверх рабочего конфига, блок 443 пропадёт: turanasia.kz перестанет
# находить свой server и запросы уйдут в первый попавшийся на 443 —
# на поддомен панели, то есть вместо сайта откроется окно входа в админку.
#
# Правка на работающем сервере — точечно, прямо в файле:
#   sudo nano /etc/nginx/sites-available/turanasia
#   sudo nginx -t && sudo systemctl reload nginx
#
# Первая установка (или если конфиг всё-таки перезаписали):
#   sudo cp deploy/nginx-turanasia.conf /etc/nginx/sites-available/turanasia
#   sudo certbot --nginx -d turanasia.kz -d www.turanasia.kz --redirect
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name turanasia.kz www.turanasia.kz;

    root /var/www/turanasia/public;
    index index.html index.php;

    # Админка переехала на отдельный поддомен
    location = /admin.html { return 301 https://panel.turanasia.kz/; }

    # Страница условий переименована в оферту
    location = /terms { return 301 /offer$is_args$args; }

    # Главная — по адресу «/», без index.html в строке браузера.
    # Проверка по $request_uri обязательна: директива index делает внутренний
    # переход на /index.html, и без неё редирект зациклится сам на себя.
    location = /index.html {
        if ($request_uri ~ ^/index\.html) { return 301 /$is_args$args; }
        try_files /index.html =404;
    }

    # Красивые адреса: /tours вместо /tours.html.
    # Точные location выше (= /index.html, = /admin.html) имеют приоритет над
    # этим регулярным, поэтому они сюда не попадают.
    location ~ ^/(?<page>.+)\.html$ {
        return 301 /$page$is_args$args;
    }

    # Карточки тура и запуска отдаёт PHP — он подставляет мета-теги для превью
    # ссылок в мессенджерах. Несуществующий первый путь нужен, чтобы try_files
    # гарантированно ушёл на фронт-контроллер, а не на статический файл.
    location = /tour   { try_files /__php /index.php?$query_string; }
    location = /launch { try_files /__php /index.php?$query_string; }
    location = /excursion { try_files /__php /index.php?$query_string; }
    location = /album  { try_files /__php /index.php?$query_string; }
    location = /media  { try_files /__php /index.php?$query_string; }

    charset utf-8;
    client_max_body_size 12M;            # запас под загрузку фото (лимит 8 МБ)

    # gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Статика фронта. $uri.html — чтобы /tours отдавал tours.html.
    # Если файла нет — фронт-контроллер Laravel (/api, /sitemap.xml и т.д.)
    location / {
        try_files $uri $uri.html $uri/ /index.php?$query_string;
    }

    # PHP (Laravel)
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # проверьте версию: php -v
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Кэш статических ассетов
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Запрет доступа к скрытым файлам (кроме /.well-known — нужен certbot)
    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/turanasia.access.log;
    error_log  /var/log/nginx/turanasia.error.log;
}
