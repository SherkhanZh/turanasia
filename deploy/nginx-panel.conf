# /etc/nginx/sites-available/panel
# Админ-панель на отдельном поддомене panel.turanasia.kz.
#
# Корень тот же, что у основного сайта, поэтому API доступен по
# panel.turanasia.kz/api/v1 и CORS не нужен: admin.js берёт адрес из location.origin.
#
# При этом публичные страницы сайта здесь намеренно НЕ отдаются: иначе весь сайт
# дублировался бы на адресе панели, а ссылки, скопированные менеджером, вели бы
# клиентов на служебный поддомен.
#
# Установка:
#   sudo cp deploy/nginx-panel.conf /etc/nginx/sites-available/panel
#   sudo ln -sf /etc/nginx/sites-available/panel /etc/nginx/sites-enabled/panel
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d panel.turanasia.kz --redirect
#
# HTTPS-блок (443) дописывает certbot.

server {
    listen 80;
    listen [::]:80;
    server_name panel.turanasia.kz;

    root /var/www/turanasia/public;
    index admin.html;

    charset utf-8;
    client_max_body_size 64M;          # запас под загрузку видео (лимит 50 МБ)

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Корень поддомена — сразу админка
    location = /           { try_files /admin.html =404; }
    location = /admin.html { try_files /admin.html =404; }

    # Поддомен целиком закрыт от поисковиков
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Проверка Let's Encrypt при продлении сертификата.
    # Без явного ^~ запрос уходил бы в общий блок ниже и получал 404.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # API админки
    location ^~ /api/ {
        try_files /__php /index.php?$query_string;
    }

    # Скрипты панели и загруженные файлы (превью в галерее)
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ^~ /storage/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }

    # Всё остальное — страницы публичного сайта — на поддомене панели недоступно
    location / { return 404; }

    access_log /var/log/nginx/panel.access.log;
    error_log  /var/log/nginx/panel.error.log;
}
